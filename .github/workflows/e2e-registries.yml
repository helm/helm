name: e2e-registries

# Runs the OCI end-to-end suite against hosted registries, to catch changes
# that break a particular registry rather than OCI in general.
#
# This workflow needs credentials, so it deliberately does not run on
# pull_request: fork PRs cannot read secrets and would fail for every outside
# contributor. Secret-free coverage against a local registry runs per-PR in
# e2e.yml.
#
# Each registry in the matrix below is configured by the same five settings,
# named after its id. If none is set the job is skipped, so forks running this
# on a schedule do not fail. If only some is set, that is a misconfiguration
# and the job fails loudly rather than being silently skipped. The token and
# username are secrets; the rest are repository variables, so they show up
# unmasked in the logs. The username is still read from a variable when no
# secret is set, so existing configuration keeps working while it moves.
#
#   vars.E2E_<ID>_REGISTRY      registry host, e.g. registry.gitlab.com
#   secrets.E2E_<ID>_USERNAME   user, robot account or deploy token name
#   secrets.E2E_<ID>_PASSWORD   token with read and write access
#   vars.E2E_<ID>_NAMESPACE     user, org or group that owns the repository
#   vars.E2E_<ID>_REPOSITORY    repository (or project) charts are pushed to
#
# Registries that do not nest repository paths, or whose token may only be
# able to write to one repository, set single-repo, and the suite pushes every
# fixture to <registry>/<namespace>/<repository> under its own version.
# Otherwise it runs in its default layout under that path. See
# test/e2e/README.md.
#
#   DOCKER  Docker Hub. Does not nest repository paths, and a scoped access
#           token may only write to one repository: single-repo.
#   GITLAB  GitLab. Nests paths under the project, and a deploy token covers
#           every repository in it. Its token endpoint only implements the
#           distribution GET flow, not OAuth2 POST, which makes it the registry
#           that catches a regression in Helm's token flow fallback.
#   QUAY    Quay.io. Does not nest repository paths, and a robot account is
#           granted write access per repository: single-repo.
#
# Adding a registry is a matrix entry plus its five settings.

on:
  schedule:
    # Nightly, after most merges have landed.
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Runs share fixed tags in each registry's repository, and repackaged fixtures
# differ byte for byte between runs, so an overlapping run could overwrite a
# tag between another run's push and pull. Queue runs rather than overlap.
concurrency:
  group: e2e-registries
  cancel-in-progress: false

jobs:
  registry:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: DOCKER
            name: Docker Hub
            single-repo: true
          - id: GITLAB
            name: GitLab
            single-repo: false
          - id: QUAY
            name: Quay
            single-repo: true
    steps:
      # Configuration is read as environment variables rather than interpolated
      # into the script, so neither a credential nor a variable becomes shell
      # source.
      - name: Resolve registry configuration
        id: config
        env:
          ID: ${{ matrix.id }}
          NAME: ${{ matrix.name }}
          SINGLE_REPO: ${{ matrix.single-repo }}
          REGISTRY: ${{ vars[format('E2E_{0}_REGISTRY', matrix.id)] }}
          USERNAME: ${{ secrets[format('E2E_{0}_USERNAME', matrix.id)] || vars[format('E2E_{0}_USERNAME', matrix.id)] }}
          PASSWORD: ${{ secrets[format('E2E_{0}_PASSWORD', matrix.id)] }}
          NAMESPACE: ${{ vars[format('E2E_{0}_NAMESPACE', matrix.id)] }}
          REPOSITORY: ${{ vars[format('E2E_{0}_REPOSITORY', matrix.id)] }}
        run: |
          set -euo pipefail
          if [ -z "${REGISTRY}${USERNAME}${PASSWORD}${NAMESPACE}${REPOSITORY}" ]; then
            echo "no ${NAME} configuration set, skipping"
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          missing=""
          [ -n "${REGISTRY}" ] || missing="${missing} vars.E2E_${ID}_REGISTRY"
          [ -n "${USERNAME}" ] || missing="${missing} secrets.E2E_${ID}_USERNAME"
          [ -n "${PASSWORD}" ] || missing="${missing} secrets.E2E_${ID}_PASSWORD"
          [ -n "${NAMESPACE}" ] || missing="${missing} vars.E2E_${ID}_NAMESPACE"
          [ -n "${REPOSITORY}" ] || missing="${missing} vars.E2E_${ID}_REPOSITORY"
          if [ -n "${missing}" ]; then
            echo "::error::${NAME} is partially configured; missing:${missing}"
            exit 1
          fi

          {
            echo "HELM_E2E_USERNAME=${USERNAME}"
            echo "HELM_E2E_PASSWORD=${PASSWORD}"
            if [ "${SINGLE_REPO}" = "true" ]; then
              echo "HELM_E2E_REGISTRY=${REGISTRY}/${NAMESPACE}"
              echo "HELM_E2E_SINGLE_REPO=${REPOSITORY}"
            else
              echo "HELM_E2E_REGISTRY=${REGISTRY}/${NAMESPACE}/${REPOSITORY}"
            fi
          } >> "$GITHUB_ENV"
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Checkout source code
        if: steps.config.outputs.configured == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v7.0.1
      - name: Add variables to environment file
        if: steps.config.outputs.configured == 'true'
        run: cat ".github/env" >> "$GITHUB_ENV"
      - name: Setup Go
        if: steps.config.outputs.configured == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # pin@7.0.0
        with:
          go-version: '${{ env.GOLANG_VERSION }}'
          check-latest: true

      # The Kubernetes install test exercises the same pull path as the
      # registry tests and already runs per-PR against a kind cluster in
      # e2e.yml, so these jobs skip it and cover only the registry.
      - name: Run end-to-end tests
        if: steps.config.outputs.configured == 'true'
        run: make test-e2e
