name: e2e-registries

# Runs the OCI end-to-end suite against hosted registries, to catch changes
# that break a particular registry rather than OCI in general.
#
# This workflow needs credentials, so it deliberately does not run on
# pull_request: fork PRs cannot read secrets and would fail for every outside
# contributor. Secret-free coverage against a local registry runs per-PR in
# e2e.yml.
#
# Required secrets. If none are set the job is skipped, so forks running this
# on a schedule do not fail. If only some are set, that is a misconfiguration
# and the job fails loudly rather than being silently skipped.
#
#   Docker Hub  E2E_DOCKER_USERNAME
#               E2E_DOCKER_PASSWORD     access token with write access to the repository
#               E2E_DOCKER_REPOSITORY   e.g. helm-e2e
#               E2E_DOCKER_NAMESPACE    optional, defaults to E2E_DOCKER_USERNAME
#
# Docker Hub does not nest repository paths, and a scoped access token may only
# be able to write to one repository, so the suite runs in single-repository
# mode: every fixture is pushed to <namespace>/<repository> under its own
# version. See test/e2e/README.md.

on:
  schedule:
    # Nightly, after most merges have landed.
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  KIND_VERSION: v0.31.0

jobs:
  dockerhub:
    runs-on: ubuntu-latest
    steps:
      # Secrets are read as environment variables rather than interpolated into
      # the script, so no credential becomes shell source.
      - name: Resolve registry configuration
        id: config
        env:
          DOCKER_USERNAME: ${{ secrets.E2E_DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.E2E_DOCKER_PASSWORD }}
          DOCKER_REPOSITORY: ${{ secrets.E2E_DOCKER_REPOSITORY }}
          DOCKER_NAMESPACE: ${{ secrets.E2E_DOCKER_NAMESPACE }}
        run: |
          set -euo pipefail
          if [ -z "${DOCKER_USERNAME}${DOCKER_PASSWORD}${DOCKER_REPOSITORY}" ]; then
            echo "no Docker Hub secrets set, skipping"
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          missing=""
          [ -n "${DOCKER_USERNAME}" ] || missing="${missing} E2E_DOCKER_USERNAME"
          [ -n "${DOCKER_PASSWORD}" ] || missing="${missing} E2E_DOCKER_PASSWORD"
          [ -n "${DOCKER_REPOSITORY}" ] || missing="${missing} E2E_DOCKER_REPOSITORY"
          if [ -n "${missing}" ]; then
            echo "::error::Docker Hub is partially configured; missing:${missing}"
            exit 1
          fi

          {
            echo "HELM_E2E_REGISTRY=registry-1.docker.io/${DOCKER_NAMESPACE:-${DOCKER_USERNAME}}"
            echo "HELM_E2E_USERNAME=${DOCKER_USERNAME}"
            echo "HELM_E2E_PASSWORD=${DOCKER_PASSWORD}"
            echo "HELM_E2E_SINGLE_REPO=${DOCKER_REPOSITORY}"
          } >> "$GITHUB_ENV"
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Checkout source code
        if: steps.config.outputs.configured == 'true'
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # pin@v6.0.0
      - name: Add variables to environment file
        if: steps.config.outputs.configured == 'true'
        run: cat ".github/env" >> "$GITHUB_ENV"
      - name: Setup Go
        if: steps.config.outputs.configured == 'true'
        uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # pin@6.1.0
        with:
          go-version: '${{ env.GOLANG_VERSION }}'
          check-latest: true

      - name: Create a kind cluster
        if: steps.config.outputs.configured == 'true'
        run: |
          set -euo pipefail
          go install "sigs.k8s.io/kind@${KIND_VERSION}"
          kind create cluster --name helm-e2e --wait 120s

      - name: Run end-to-end tests
        if: steps.config.outputs.configured == 'true'
        env:
          HELM_E2E_KUBERNETES: "true"
        run: make test-e2e
