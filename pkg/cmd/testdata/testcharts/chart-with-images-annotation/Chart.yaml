apiVersion: v2
name: chart-with-images-annotation
description: Chart declaring its container images via the HIP-0015 helm.sh/images annotation
version: 0.1.0
appVersion: "6.0.0"
annotations:
  helm.sh/images: |
    - name: podinfo
      image: ghcr.io/stefanprodan/podinfo:6.0.0
    - name: redis
      image: docker.io/library/redis:6.0.8
      dependency: redis
      whitelisted: true
dependencies:
  - name: redis
    version: 0.1.0
