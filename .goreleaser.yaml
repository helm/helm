version: 2

project_name: helm

dist: _dist
builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    goarch:
      - amd64
      - arm64
      - arm
      - "386"
      - ppc64le
      - s390x
      - riscv64
      - loong64
    goamd64:
      - v1
    goarm:
      - "7"
    goarm64:
      - v8.0
    go386:
      - sse2
    goriscv64:
      - rva20u64
    ignore:
      - goos: darwin
        goarch: "386"
      - goos: darwin
        goarch: arm
      - goos: darwin
        goarch: ppc64le
      - goos: darwin
        goarch: s390x
      - goos: darwin
        goarch: riscv64
      - goos: darwin
        goarch: loong64
      - goos: windows
        goarch: "386"
      - goos: windows
        goarch: arm
      - goos: windows
        goarch: ppc64le
      - goos: windows
        goarch: s390x
      - goos: windows
        goarch: riscv64
      - goos: windows
        goarch: loong64
    main: ./cmd/helm
    binary: helm
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -w -s
      - -extldflags "-static"
      - -X helm.sh/helm/v4/internal/version.version={{ .Tag }}
      - -X helm.sh/helm/v4/internal/version.metadata=
      - -X helm.sh/helm/v4/internal/version.gitCommit={{ .FullCommit }}
      - -X helm.sh/helm/v4/internal/version.gitTreeState=clean
    flags:
      - -trimpath
    dir: .

source:
  enabled: true
  name_template: "{{ .ProjectName }}.src"

archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "helm-{{ .Tag }}-{{ .Os }}-{{ .Arch }}"
    wrap_in_directory: true
    files:
      - LICENSE
      - README.md
    builds_info:
      mtime: "{{ .CommitTimestamp }}"

sboms:
  - artifacts: archive
  - id: source
    artifacts: source

checksum:
  name_template: "checksums.txt"

signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args:
      - sign-blob
      - "--bundle=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

snapshot:
  version_template: "{{ if index .Env \"GORELEASER_CURRENT_TAG\" }}{{ .Env.GORELEASER_CURRENT_TAG }}{{ else }}{{ incpatch .Version }}-next{{ end }}"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
